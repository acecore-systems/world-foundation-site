name: Sync Vectorize search index

on:
  pull_request:
    branches:
      - main
      - preview
  push:
    branches:
      - preview
  workflow_dispatch:
    inputs:
      target:
        description: 同期先の Vectorize index
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  actions: read
  contents: read

env:
  CONTENT_REPOSITORY: acecore-systems/world-foundation
  PRODUCTION_BUILD_MARKER_URL: https://world-foundation.acecore.net/.well-known/world-foundation-build.json

jobs:
  verify-pull-request:
    name: Verify semantic search changes without secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require protected preview as the source of main promotions
        if: github.base_ref == 'main'
        shell: bash
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" != "preview" ]] ||
             [[ "$HEAD_REPOSITORY" != "$EXPECTED_HEAD_REPOSITORY" ]]; then
            echo "::error::Changes must be reviewed and deployed through the protected preview branch before main."
            exit 1
          fi

      - name: Resolve successful Preview Vectorize sync evidence
        id: preview-evidence
        if: github.base_ref == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow_runs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$REPOSITORY/actions/runs?branch=preview&head_sha=$HEAD_SHA&status=completed&per_page=100"
          )"
          RUNS_JSON="$workflow_runs" node <<'NODE' >> "$GITHUB_OUTPUT"
          const runs = JSON.parse(process.env.RUNS_JSON).workflow_runs || []
          const matchingRun = runs.find(
            (run) =>
              run.path === '.github/workflows/sync-vectorize.yml' &&
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.head_branch === 'preview' &&
              run.head_sha === process.env.HEAD_SHA &&
              run.status === 'completed' &&
              run.conclusion === 'success',
          )
          if (!matchingRun) {
            throw new Error(
              'The exact preview commit must complete its Vectorize sync before promotion.',
            )
          }
          console.log(`run_id=${matchingRun.id}`)
          NODE

      - name: Check out the exact pull request site commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: site
          persist-credentials: false

      - name: Verify the pull request site identity
        id: site
        shell: bash
        env:
          EXPECTED_SITE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          site_commit="$(git -C site rev-parse HEAD)"
          if [[ ! "$site_commit" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$site_commit" != "$EXPECTED_SITE_COMMIT" ]]; then
            echo "::error::The checked-out site commit does not match the pull request head."
            exit 1
          fi
          if [[ -n "$(git -C site status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The pull request site checkout is not clean."
            exit 1
          fi
          echo "commit=$site_commit" >> "$GITHUB_OUTPUT"

      - name: Check out the exact current content source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: main
          fetch-depth: 0
          path: content
          persist-credentials: false

      - name: Resolve the content identity
        id: content
        shell: bash
        run: |
          set -euo pipefail
          content_commit="$(git -C content rev-parse HEAD)"
          if [[ ! "$content_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The content commit is not a full Git SHA."
            exit 1
          fi
          if [[ -n "$(git -C content status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The content checkout is not clean."
            exit 1
          fi
          echo "commit=$content_commit" >> "$GITHUB_OUTPUT"

      - name: Download the corpus used by the successful Preview sync
        if: github.base_ref == 'main'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: world-foundation-vectorize-preview-*
          path: preview-evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.preview-evidence.outputs.run_id }}

      - name: Verify the deployed Preview and synced corpus identities
        if: github.base_ref == 'main'
        shell: bash
        env:
          EXPECTED_CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          EXPECTED_SITE_COMMIT: ${{ steps.site.outputs.commit }}
          PREVIEW_BUILD_MARKER_URL: https://preview.world-foundation-site.pages.dev/.well-known/world-foundation-build.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const corpus = JSON.parse(
            fs.readFileSync('preview-evidence/corpus.json', 'utf8'),
          )
          if (
            corpus.siteCommit !== process.env.EXPECTED_SITE_COMMIT ||
            corpus.contentCommit !== process.env.EXPECTED_CONTENT_COMMIT
          ) {
            throw new Error(
              'The successful Preview sync corpus does not match the exact promotion inputs.',
            )
          }
          NODE
          node site/scripts/wait-for-deployment.mjs \
            "$PREVIEW_BUILD_MARKER_URL" \
            "$EXPECTED_SITE_COMMIT"
          node site/scripts/wait-for-deployment.mjs \
            "$PREVIEW_BUILD_MARKER_URL" \
            --assert-current \
            preview-evidence/corpus.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build the exact site and content corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
          WORLD_FOUNDATION_CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          WORLD_FOUNDATION_SOURCE: ${{ github.workspace }}/content
        run: npm run build

      - name: Run semantic search tests
        working-directory: site
        run: npm run test:search

      - name: Verify generated Cloudflare types
        working-directory: site
        run: npm run types:cloudflare:check

      - name: Verify the Pages Functions bundle
        working-directory: site
        run: npm run check:pages-config

      - name: Type-check Pages Functions
        working-directory: site
        run: npm run typecheck:functions

      - name: Verify corpus identity with a preview dry run
        working-directory: site
        run: >-
          npm run sync:vectorize:dry-run --
          --corpus .vectorize/corpus.json
          --target preview
          --expected-site-commit ${{ steps.site.outputs.commit }}
          --expected-content-commit ${{ steps.content.outputs.commit }}
          --expected-corpus-version
          $(node -p "JSON.parse(require('node:fs').readFileSync('.vectorize/corpus.json', 'utf8')).version")

  build-preview-corpus:
    name: Build and verify preview corpus without secrets
    if: >-
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/preview'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/preview' &&
        inputs.target == 'preview'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      content_commit: ${{ steps.content.outputs.commit }}
      corpus_sha256: ${{ steps.identity.outputs.corpus_sha256 }}
      corpus_version: ${{ steps.identity.outputs.corpus_version }}
      site_branch: ${{ steps.site.outputs.branch }}
      site_commit: ${{ steps.site.outputs.commit }}

    steps:
      - name: Check out the exact dispatched site commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: site
          persist-credentials: false

      - name: Verify the site commit is the current protected source
        id: site
        shell: bash
        env:
          EXPECTED_SITE_COMMIT: ${{ github.sha }}
          SITE_BRANCH: preview
        run: |
          set -euo pipefail
          site_commit="$(git -C site rev-parse HEAD)"
          git -C site fetch --no-tags origin \
            "+refs/heads/$SITE_BRANCH:refs/remotes/origin/$SITE_BRANCH"
          if [[ ! "$site_commit" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$site_commit" != "$EXPECTED_SITE_COMMIT" ]]; then
            echo "::error::The checked-out site commit does not match the dispatched commit."
            exit 1
          fi
          if [[ -n "$(git -C site status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The dispatched site checkout is not clean."
            exit 1
          fi
          current_branch_commit="$(git -C site rev-parse "refs/remotes/origin/$SITE_BRANCH")"
          if [[ "$site_commit" != "$current_branch_commit" ]]; then
            echo "::error::Preview sync only accepts the current protected source branch commit."
            exit 1
          fi
          echo "branch=$SITE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$site_commit" >> "$GITHUB_OUTPUT"

      - name: Check out the exact current content source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: main
          fetch-depth: 0
          path: content
          persist-credentials: false

      - name: Resolve and verify the content identity
        id: content
        shell: bash
        run: |
          set -euo pipefail
          content_commit="$(git -C content rev-parse HEAD)"
          git -C content fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if [[ ! "$content_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The content commit is not a full Git SHA."
            exit 1
          fi
          if [[ -n "$(git -C content status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The content checkout is not clean."
            exit 1
          fi
          current_content_commit="$(git -C content rev-parse refs/remotes/origin/main)"
          if [[ "$content_commit" != "$current_content_commit" ]]; then
            echo "::error::Preview sync only accepts the current content main commit."
            exit 1
          fi
          echo "commit=$content_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build the exact site and content corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
          WORLD_FOUNDATION_CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          WORLD_FOUNDATION_SOURCE: ${{ github.workspace }}/content
        run: npm run build

      - name: Run semantic search tests
        working-directory: site
        run: npm run test:search

      - name: Verify generated Cloudflare types
        working-directory: site
        run: npm run types:cloudflare:check

      - name: Verify the Pages Functions bundle
        working-directory: site
        run: npm run check:pages-config

      - name: Type-check Pages Functions
        working-directory: site
        run: npm run typecheck:functions

      - name: Resolve and verify the built corpus identity
        id: identity
        shell: bash
        working-directory: site
        env:
          EXPECTED_CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          EXPECTED_SITE_COMMIT: ${{ steps.site.outputs.commit }}
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/vectorize-corpus-identity"
          const fs = require('node:fs')
          const corpus = JSON.parse(
            fs.readFileSync('.vectorize/corpus.json', 'utf8'),
          )
          const commitPattern = /^[0-9a-f]{40}$/
          const versionPattern = /^[0-9a-f]{20}$/
          if (
            !commitPattern.test(corpus.siteCommit) ||
            !commitPattern.test(corpus.contentCommit) ||
            !versionPattern.test(corpus.version) ||
            corpus.siteCommit !== process.env.EXPECTED_SITE_COMMIT ||
            corpus.contentCommit !== process.env.EXPECTED_CONTENT_COMMIT
          ) {
            throw new Error('The preview corpus identity does not match its exact inputs.')
          }
          console.log(`corpus_version=${corpus.version}`)
          console.log(`artifact_name=world-foundation-vectorize-preview-${corpus.version}`)
          NODE
          cat "$RUNNER_TEMP/vectorize-corpus-identity" >> "$GITHUB_OUTPUT"
          corpus_sha256="$(sha256sum .vectorize/corpus.json | cut -d ' ' -f 1)"
          echo "corpus_sha256=$corpus_sha256" >> "$GITHUB_OUTPUT"

      - name: Verify corpus identity with a preview dry run
        working-directory: site
        run: >-
          npm run sync:vectorize:dry-run --
          --corpus .vectorize/corpus.json
          --target preview
          --expected-site-commit ${{ steps.site.outputs.commit }}
          --expected-content-commit ${{ steps.content.outputs.commit }}
          --expected-corpus-version ${{ steps.identity.outputs.corpus_version }}

      - name: Stage the verified corpus artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          install -m 0644 site/.vectorize/corpus.json artifact/corpus.json

      - name: Upload the verified preview corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: artifact/corpus.json
          if-no-files-found: error
          retention-days: 7

  sync-preview:
    name: Sync verified preview corpus
    needs:
      - build-preview-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-world-foundation-search-preview
    concurrency:
      group: world-foundation-vectorize-preview
      cancel-in-progress: true

    steps:
      - name: Check out the exact protected-source tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-preview-corpus.outputs.site_commit }}
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Verify the tooling commit is still the protected source
        shell: bash
        env:
          EXPECTED_SITE_COMMIT: ${{ needs.build-preview-corpus.outputs.site_commit }}
          SITE_BRANCH: ${{ needs.build-preview-corpus.outputs.site_branch }}
        run: |
          set -euo pipefail
          tooling_commit="$(git -C tooling rev-parse HEAD)"
          git -C tooling fetch --no-tags origin \
            "+refs/heads/$SITE_BRANCH:refs/remotes/origin/$SITE_BRANCH"
          if [[ "$tooling_commit" != "$EXPECTED_SITE_COMMIT" ]]; then
            echo "::error::The privileged tooling checkout changed identity."
            exit 1
          fi
          current_branch_commit="$(git -C tooling rev-parse "refs/remotes/origin/$SITE_BRANCH")"
          if [[ "$tooling_commit" != "$current_branch_commit" ]]; then
            echo "::error::Preview sync tooling is no longer current protected source."
            exit 1
          fi

      - name: Check out the current content identity verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ needs.build-preview-corpus.outputs.content_commit }}
          fetch-depth: 0
          path: current-content
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tooling/.node-version

      - name: Download the verified preview corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-preview-corpus.outputs.artifact_name }}
          path: payload

      - name: Verify the downloaded artifact and identity without secrets
        shell: bash
        env:
          EXPECTED_CONTENT_COMMIT: ${{ needs.build-preview-corpus.outputs.content_commit }}
          EXPECTED_CORPUS_SHA256: ${{ needs.build-preview-corpus.outputs.corpus_sha256 }}
          EXPECTED_CORPUS_VERSION: ${{ needs.build-preview-corpus.outputs.corpus_version }}
          EXPECTED_SITE_COMMIT: ${{ needs.build-preview-corpus.outputs.site_commit }}
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum payload/corpus.json | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_CORPUS_SHA256" ]]; then
            echo "::error::The downloaded corpus digest does not match the verified build."
            exit 1
          fi
          node tooling/scripts/sync-vectorize.mjs \
            --dry-run \
            --corpus payload/corpus.json \
            --target preview \
            --expected-site-commit "$EXPECTED_SITE_COMMIT" \
            --expected-content-commit "$EXPECTED_CONTENT_COMMIT" \
            --expected-corpus-version "$EXPECTED_CORPUS_VERSION"

      - name: Sync the preview index
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SEARCH_PREVIEW_API_TOKEN }}
          EXPECTED_CONTENT_COMMIT: ${{ needs.build-preview-corpus.outputs.content_commit }}
          EXPECTED_CORPUS_VERSION: ${{ needs.build-preview-corpus.outputs.corpus_version }}
          EXPECTED_SITE_COMMIT: ${{ needs.build-preview-corpus.outputs.site_commit }}
          SITE_BRANCH: ${{ needs.build-preview-corpus.outputs.site_branch }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_SEARCH_PREVIEW_API_TOKEN is not configured."
            exit 1
          fi
          verify_current_identities() {
            git -C tooling fetch --no-tags origin \
              "+refs/heads/$SITE_BRANCH:refs/remotes/origin/$SITE_BRANCH"
            current_branch_commit="$(git -C tooling rev-parse "refs/remotes/origin/$SITE_BRANCH")"
            if [[ "$EXPECTED_SITE_COMMIT" != "$current_branch_commit" ]]; then
              echo "::error::Protected preview source changed during the sync run."
              exit 1
            fi
            git -C current-content fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            current_content_commit="$(git -C current-content rev-parse refs/remotes/origin/main)"
            if [[ "$EXPECTED_CONTENT_COMMIT" != "$current_content_commit" ]]; then
              echo "::error::Content main changed during the sync run."
              exit 1
            fi
          }
          verify_current_identities
          node tooling/scripts/sync-vectorize.mjs \
            --corpus payload/corpus.json \
            --target preview \
            --expected-site-commit "$EXPECTED_SITE_COMMIT" \
            --expected-content-commit "$EXPECTED_CONTENT_COMMIT" \
            --expected-corpus-version "$EXPECTED_CORPUS_VERSION"
          verify_current_identities

  build-production-corpus:
    name: Build the deployed production corpus without secrets
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      content_commit: ${{ steps.deployed.outputs.content_commit }}
      corpus_sha256: ${{ steps.identity.outputs.corpus_sha256 }}
      corpus_version: ${{ steps.deployed.outputs.corpus_version }}
      site_commit: ${{ steps.deployed.outputs.site_commit }}

    steps:
      - name: Check out protected-main deployment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: verifier
          persist-credentials: false

      - name: Verify deployment verifier belongs to protected main
        shell: bash
        run: |
          set -euo pipefail
          verifier_commit="$(git -C verifier rev-parse HEAD)"
          if [[ -n "$(git -C verifier status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The production verifier checkout is not clean."
            exit 1
          fi
          git -C verifier fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git -C verifier merge-base --is-ancestor \
            "$verifier_commit" refs/remotes/origin/main

      - name: Set up verifier Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: verifier/.node-version

      - name: Resolve the exact deployed build
        id: deployed
        shell: bash
        run: |
          set -euo pipefail
          marker="$(
            node verifier/scripts/wait-for-deployment.mjs \
              "$PRODUCTION_BUILD_MARKER_URL" \
              --print-current
          )"
          MARKER_JSON="$marker" node <<'NODE' >> "$GITHUB_OUTPUT"
          const marker = JSON.parse(process.env.MARKER_JSON)
          const commitPattern = /^[0-9a-f]{40}$/
          const versionPattern = /^[0-9a-f]{20}$/
          if (
            marker.schemaVersion !== 1 ||
            !commitPattern.test(marker.siteCommit) ||
            !commitPattern.test(marker.contentCommit) ||
            !versionPattern.test(marker.searchCorpusVersion)
          ) {
            throw new Error('The deployed build marker identity is invalid.')
          }
          console.log(`site_commit=${marker.siteCommit}`)
          console.log(`content_commit=${marker.contentCommit}`)
          console.log(`corpus_version=${marker.searchCorpusVersion}`)
          NODE

      - name: Verify the deployed site commit belongs to protected main
        shell: bash
        env:
          SITE_COMMIT: ${{ steps.deployed.outputs.site_commit }}
        run: |
          set -euo pipefail
          git -C verifier cat-file -e "${SITE_COMMIT}^{commit}"
          git -C verifier merge-base --is-ancestor \
            "$SITE_COMMIT" refs/remotes/origin/main

      - name: Check out the exact deployed site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.site_commit }}
          fetch-depth: 0
          path: site
          persist-credentials: false

      - name: Check out the exact deployed content source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.deployed.outputs.content_commit }}
          fetch-depth: 0
          path: content
          persist-credentials: false

      - name: Verify the deployed content commit belongs to content main
        shell: bash
        env:
          CONTENT_COMMIT: ${{ steps.deployed.outputs.content_commit }}
        run: |
          set -euo pipefail
          if [[ -n "$(git -C site status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The deployed site checkout is not clean."
            exit 1
          fi
          if [[ -n "$(git -C content status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The deployed content checkout is not clean."
            exit 1
          fi
          git -C content fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git -C content merge-base --is-ancestor \
            "$CONTENT_COMMIT" refs/remotes/origin/main

      - name: Set up the exact site Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deployed site dependencies
        working-directory: site
        run: npm ci

      - name: Build the exact deployed site and content corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.deployed.outputs.site_commit }}
          WORLD_FOUNDATION_CONTENT_COMMIT: ${{ steps.deployed.outputs.content_commit }}
          WORLD_FOUNDATION_SOURCE: ${{ github.workspace }}/content
        run: npm run build

      - name: Run semantic search tests
        working-directory: site
        run: npm run test:search

      - name: Verify generated Cloudflare types
        working-directory: site
        run: npm run types:cloudflare:check

      - name: Verify the Pages Functions bundle
        working-directory: site
        run: npm run check:pages-config

      - name: Type-check Pages Functions
        working-directory: site
        run: npm run typecheck:functions

      - name: Resolve and verify the built corpus identity
        id: identity
        shell: bash
        working-directory: site
        env:
          EXPECTED_CONTENT_COMMIT: ${{ steps.deployed.outputs.content_commit }}
          EXPECTED_CORPUS_VERSION: ${{ steps.deployed.outputs.corpus_version }}
          EXPECTED_SITE_COMMIT: ${{ steps.deployed.outputs.site_commit }}
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/vectorize-corpus-identity"
          const fs = require('node:fs')
          const corpus = JSON.parse(
            fs.readFileSync('.vectorize/corpus.json', 'utf8'),
          )
          if (
            corpus.siteCommit !== process.env.EXPECTED_SITE_COMMIT ||
            corpus.contentCommit !== process.env.EXPECTED_CONTENT_COMMIT ||
            corpus.version !== process.env.EXPECTED_CORPUS_VERSION
          ) {
            throw new Error('The production corpus identity differs from the deployed marker.')
          }
          console.log(`artifact_name=world-foundation-vectorize-production-${corpus.version}`)
          NODE
          cat "$RUNNER_TEMP/vectorize-corpus-identity" >> "$GITHUB_OUTPUT"
          corpus_sha256="$(sha256sum .vectorize/corpus.json | cut -d ' ' -f 1)"
          echo "corpus_sha256=$corpus_sha256" >> "$GITHUB_OUTPUT"

      - name: Verify corpus identity with a production dry run
        working-directory: site
        run: >-
          npm run sync:vectorize:dry-run --
          --corpus .vectorize/corpus.json
          --target production
          --expected-site-commit ${{ steps.deployed.outputs.site_commit }}
          --expected-content-commit ${{ steps.deployed.outputs.content_commit }}
          --expected-corpus-version ${{ steps.deployed.outputs.corpus_version }}
          --confirm-production ${{ steps.deployed.outputs.corpus_version }}

      - name: Confirm all three corpus identity values are still public
        run: >-
          node verifier/scripts/wait-for-deployment.mjs
          "$PRODUCTION_BUILD_MARKER_URL"
          --assert-current
          site/.vectorize/corpus.json

      - name: Stage the verified corpus artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          install -m 0644 site/.vectorize/corpus.json artifact/corpus.json

      - name: Upload the verified production corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: artifact/corpus.json
          if-no-files-found: error
          retention-days: 1

  sync-production:
    name: Sync the currently deployed production corpus
    needs:
      - build-production-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-world-foundation-search-production
    concurrency:
      group: world-foundation-vectorize-production
      cancel-in-progress: false

    steps:
      - name: Check out the exact protected-main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-production-corpus.outputs.site_commit }}
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Verify the tooling commit still belongs to protected main
        shell: bash
        env:
          EXPECTED_SITE_COMMIT: ${{ needs.build-production-corpus.outputs.site_commit }}
        run: |
          set -euo pipefail
          tooling_commit="$(git -C tooling rev-parse HEAD)"
          git -C tooling fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$tooling_commit" != "$EXPECTED_SITE_COMMIT" ]]; then
            echo "::error::The privileged tooling checkout changed identity."
            exit 1
          fi
          git -C tooling merge-base --is-ancestor \
            "$tooling_commit" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tooling/.node-version

      - name: Download the verified production corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-production-corpus.outputs.artifact_name }}
          path: payload

      - name: Verify the downloaded artifact and identity without secrets
        shell: bash
        env:
          EXPECTED_CONTENT_COMMIT: ${{ needs.build-production-corpus.outputs.content_commit }}
          EXPECTED_CORPUS_SHA256: ${{ needs.build-production-corpus.outputs.corpus_sha256 }}
          EXPECTED_CORPUS_VERSION: ${{ needs.build-production-corpus.outputs.corpus_version }}
          EXPECTED_SITE_COMMIT: ${{ needs.build-production-corpus.outputs.site_commit }}
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum payload/corpus.json | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_CORPUS_SHA256" ]]; then
            echo "::error::The downloaded corpus digest does not match the verified build."
            exit 1
          fi
          node tooling/scripts/sync-vectorize.mjs \
            --dry-run \
            --corpus payload/corpus.json \
            --target production \
            --expected-site-commit "$EXPECTED_SITE_COMMIT" \
            --expected-content-commit "$EXPECTED_CONTENT_COMMIT" \
            --expected-corpus-version "$EXPECTED_CORPUS_VERSION" \
            --confirm-production "$EXPECTED_CORPUS_VERSION"

      - name: Confirm all three corpus identity values are still public
        run: >-
          node tooling/scripts/wait-for-deployment.mjs
          "$PRODUCTION_BUILD_MARKER_URL"
          --assert-current
          payload/corpus.json

      - name: Sync the production index
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SEARCH_PRODUCTION_API_TOKEN }}
          EXPECTED_CONTENT_COMMIT: ${{ needs.build-production-corpus.outputs.content_commit }}
          EXPECTED_CORPUS_VERSION: ${{ needs.build-production-corpus.outputs.corpus_version }}
          EXPECTED_SITE_COMMIT: ${{ needs.build-production-corpus.outputs.site_commit }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_SEARCH_PRODUCTION_API_TOKEN is not configured."
            exit 1
          fi
          node tooling/scripts/wait-for-deployment.mjs \
            "$PRODUCTION_BUILD_MARKER_URL" \
            --assert-current \
            payload/corpus.json
          node tooling/scripts/sync-vectorize.mjs \
            --corpus payload/corpus.json \
            --target production \
            --expected-site-commit "$EXPECTED_SITE_COMMIT" \
            --expected-content-commit "$EXPECTED_CONTENT_COMMIT" \
            --expected-corpus-version "$EXPECTED_CORPUS_VERSION" \
            --confirm-production "$EXPECTED_CORPUS_VERSION"
          node tooling/scripts/wait-for-deployment.mjs \
            "$PRODUCTION_BUILD_MARKER_URL" \
            --assert-current \
            payload/corpus.json
